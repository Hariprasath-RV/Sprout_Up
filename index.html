        // --- Utility Functions (Simulated Data, Firebase, Toast) ---

        const generatePriceRange = (crop) => { 
             const base = CROP_BASES[crop].base;
             const variance = base * 0.2; // 20% variance
             const farmerMin = Math.floor((base - variance) + Math.random() * variance * 0.5);
             const farmerMax = Math.floor((base + variance) + Math.random() * variance * 0.5);
             return { farmerMin, farmerMax };
        };
        const simulateMarketTrends = () => { 
             const trends = [];
             for(let i=0; i<3; i++) {
                 const crop = CROP_OPTIONS[Math.floor(Math.random() * CROP_OPTIONS.length)];
                 trends.push({ crop, percentChange: (Math.random() * 5 + 1) * (i < 2 ? 1 : -1), currentPrice: CROP_BASES[crop].base + (Math.random() * 10) });
             }
             const topGainer = trends.reduce((max, trend) => trend.percentChange > max.percentChange ? trend : max, { percentChange: -Infinity });
             const topLoser = trends.reduce((min, trend) => trend.percentChange < min.percentChange ? trend : min, { percentChange: Infinity });
             
             // Simulated Live Commodity Data
             const liveCommodities = [
                 { crop: 'Paddy (IR-20)', price: (2200 + Math.random() * 100).toFixed(0), unit: 'Quintal', change: Math.random() * 2 - 1 },
                 { crop: 'Cotton (Bales)', price: (35000 + Math.random() * 2000).toFixed(0), unit: 'Bale', change: Math.random() * 2 - 1 },
                 { crop: 'Turmeric (Kg)', price: (120 + Math.random() * 10).toFixed(2), unit: 'Kg', change: Math.random() * 2 - 1 },
             ];
             
             return { topGainer, topLoser, liveCommodities };
        };
        const fetchMLData = async (cropType, region) => { 
             return new Promise(resolve => {
                 setTimeout(() => {
                     const { farmerMin, farmerMax } = generatePriceRange(cropType);
                     const farmerPrice = Math.floor(Math.random() * (farmerMax - farmerMin) + farmerMin);
                     const tomorrowPrice = Math.floor(farmerPrice * (1 + (Math.random() * 0.1 - 0.03))); // +/- 3% to 7% change
                     const bestRegion = TN_DISTRICTS[Math.floor(Math.random() * TN_DISTRICTS.length)];
                     const bestRegionPrice = tomorrowPrice + Math.floor(Math.random() * 5 + 1);
                     
                     // New advice calculation: 
                     // If TomorrowPrice is significantly lower than current farmerPrice, adviceValue is low (WAIT/RED).
                     // If TomorrowPrice is significantly higher than current farmerPrice, adviceValue is high (SELL/GREEN).
                     const priceDifference = tomorrowPrice - farmerPrice;
                     // Map a difference range (e.g., -5 to +10) to 0-100.
                     const minDiff = -5;
                     const maxDiff = 10;
                     let adviceValue = (priceDifference - minDiff) / (maxDiff - minDiff) * 100;
                     adviceValue = Math.min(100, Math.max(0, Math.round(adviceValue)));
                     
                     const history = Array(30).fill(0).map((_, i) => ({
                         day: 30 - i,
                         price: Math.floor(farmerPrice * (1 + (Math.random() * 0.2 - 0.1)) + 5 * Math.sin(i / 5)) 
                     })).reverse();
                     
                     resolve({
                         cropType, region,
                         farmerPrice: farmerPrice.toFixed(2),
                         tomorrowPrice: tomorrowPrice.toFixed(2),
                         bestRegion,
                         bestRegionPrice: bestRegionPrice.toFixed(2),
                         adviceValue: adviceValue, // 0-100 value for gauge
                         priceHistory: history,
                         marketTrends: simulateMarketTrends()
                     });
                 }, 1500); // Simulate API call delay
             });
        };

        const showToast = (message, type = 'success') => {
            const toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) return;

            const baseClass = 'fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl shadow-2xl transition-all duration-300 z-50 flex items-center';
            let colorClass = type === 'success' ? 'bg-green-600 text-white' : 'bg-red-600 text-white'; 
            let iconSvg = type === 'success' ? `<svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` : `<svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;

            const ctx = canvas.getContext('2d');
            const size = canvas.width; 
            const center = size / 2;
            const radius = size * 0.35;
            const arcWidth = size * 0.08;

            ctx.clearRect(0, 0, size, size);

            // Draw Gauge Background Segments (0-40 Wait, 40-60 Hold, 60-100 Sell)
            const startAngle = Math.PI; // 180 degrees
            const endAngle = 2 * Math.PI; // 360 degrees

            // Helper to draw an arc segment
            const drawSegment = (color, start, end) => {
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = arcWidth;
                ctx.arc(center, center, radius, start, end);
                ctx.stroke();
            };

            // 1. Wait Zone (Red: 0% to 40%) - Expect price rise, so WAIT
            drawSegment('#EF4444', startAngle, startAngle + 0.4 * Math.PI); 
            // 2. Hold Zone (Amber: 40% to 60%) - Stable/Monitor

            // 3. Sell Zone (Green: 60% to 100%) - Price peaking, so SELL

            // Normalize value (0-100) to an angle from PI (0%) to 2*PI (100%)
            const normalizedAngle = Math.PI + (value / 100) * Math.PI; 
            
            ctx.translate(center, center);
            ctx.rotate(normalizedAngle);

            // Needle style

            ctx.moveTo(0, 5); 
            ctx.lineTo(0, -5); 
            ctx.lineTo(radius * 0.9, 0); // Tip
            ctx.closePath();
            
            ctx.fillStyle = needleColor;
            ctx.fill();

            // Needle pivot (center dot)
            ctx.beginPath();
            ctx.arc(0, 0, arcWidth / 3, 0, 2 * Math.PI);
            ctx.fillStyle = '#374151'; 
            ctx.fill();

            // Draw labels
            ctx.rotate(-normalizedAngle); // Rotate back for text
            ctx.fillStyle = '#111827';
            ctx.font = '14px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(value + '%', 0, -(radius * 0.5)); // Display percentage above pivot

        const handleLogout = async () => {

        // --- Chart Drawing Logic & Language Listeners (Kept the same) ---
        function drawChart(data) { 
             const canvas = document.getElementById('priceChart');
             if (!canvas) return;
             // Set canvas size dynamically based on container size for responsiveness
             const container = canvas.parentElement;
             canvas.width = container.clientWidth;
             canvas.height = container.clientHeight;

             const ctx = canvas.getContext('2d');
             
             // Chart dimensions
             const width = canvas.width;
             const height = canvas.height;
             const padding = 30;
             const chartWidth = width - 2 * padding;
             const chartHeight = height - 2 * padding;
             
             // Data processing
             const prices = data.map(d => d.price);
             const maxPrice = Math.max(...prices);
             const minPrice = Math.min(...prices);
             const range = maxPrice - minPrice;
             const stepX = chartWidth / (data.length - 1);
             
             ctx.clearRect(0, 0, width, height);
             
             // Draw grid lines and labels
             ctx.strokeStyle = '#e5e7eb';
             ctx.lineWidth = 1;
             ctx.fillStyle = '#6b7280';
             ctx.font = '10px Inter';

             for (let i = 0; i < 5; i++) {
                 const y = padding + chartHeight * (i / 4);
                 ctx.beginPath();
                 ctx.moveTo(padding, y);
                 ctx.lineTo(width - padding, y);
                 ctx.stroke();
                 
                 const priceLabel = (maxPrice - (range * (i / 4))).toFixed(0);
                 ctx.textAlign = 'right';
                 ctx.fillText(`₹${priceLabel}`, padding - 5, y + 3);
             }
             
             // Draw X-axis label
             ctx.textAlign = 'center';
             ctx.fillText('Days Ago (30 to 1)', width / 2, height - 5);
             
             // Draw the line graph
             ctx.beginPath();
             ctx.strokeStyle = '#22c55e'; /* Vibrant Green */
             ctx.lineWidth = 3;
             ctx.lineCap = 'round';
             ctx.lineJoin = 'round';
             
             data.forEach((d, i) => {
                 const x = padding + i * stepX;
                 const y = padding + chartHeight * (1 - (d.price - minPrice) / range);
                 if (i === 0) {
                     ctx.moveTo(x, y);
                 } else {
                     ctx.lineTo(x, y);
                 }
             });
             ctx.stroke();
             
             // Add points
             ctx.fillStyle = '#16a34a'; /* Darker Green */
             data.forEach((d, i) => {
                 const x = padding + i * stepX;
                 const y = padding + chartHeight * (1 - (d.price - minPrice) / range);
                 ctx.beginPath();
                 ctx.arc(x, y, 3, 0, 2 * Math.PI);
                 ctx.fill();
             });

             // Add tooltip handler
             canvas.onmousemove = (e) => {
                 const rect = canvas.getBoundingClientRect();
                 const mouseX = e.clientX - rect.left;
                 
                 let nearestIndex = -1;
                 let minDistance = Infinity;

                 data.forEach((d, i) => {
                     const x = padding + i * stepX;
                     const distance = Math.abs(mouseX - x);
                     if (distance < minDistance) {
                         minDistance = distance;
                         nearestIndex = i;
                     }
                 });

                 if (minDistance < stepX / 2 && nearestIndex !== -1) {
                     const d = data[nearestIndex];
                     
                     const tooltip = document.getElementById('chartTooltip');
                     tooltip.innerHTML = I18N[currentLang].chart_tooltip.replace('%d', data.length - nearestIndex).replace('%s', d.price.toFixed(2));
                     
                     // Position tooltip relative to the canvas container (using clientX/clientY)
                     tooltip.style.left = `${e.clientX + 10}px`;
                     tooltip.style.top = `${e.clientY - 30}px`;
                     tooltip.classList.remove('hidden');
                 } else {
                     document.getElementById('chartTooltip').classList.add('hidden');
                 }
             };
             canvas.onmouseleave = () => {
                 document.getElementById('chartTooltip').classList.add('hidden');
             };
        }

        const applyLanguageSwitchListeners = () => { 
             // Logic handled by the switchLanguage function and re-rendering of components
        };
